packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@fortawesome/fontawesome-common-types": true
  "@fortawesome/fontawesome-free": true
  "@fortawesome/fontawesome-svg-core": true
  "@fortawesome/free-brands-svg-icons": true
  "@fortawesome/free-regular-svg-icons": true
  "@fortawesome/free-solid-svg-icons": true
  "@prisma/client": true
  "@prisma/engines": true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  'postcss@<8.5.18': ^8.5.18
  'sharp@<0.35.0': ^0.35.3
  'uuid@<11.1.1': ^11.1.1
  'lodash@<4.17.24': ^4.17.24
  'js-yaml@4': ^4.3.0
  'glob@>=10.2.0 <10.5.0': ^10.5.0
  'cross-spawn@<6.0.6': ^6.0.6
